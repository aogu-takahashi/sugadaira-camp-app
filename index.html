<style>
  :root { --bg: #ffffff; --fg: #222222; --muted: #666666; --link: #1a5fb4; }
  @media (prefers-color-scheme: dark) { :root { --bg: #1e1e1e; --fg: #e6e6e6; --muted: #a0a0a0; --link: #8ab4f8; } }
  body { margin: 0; background: var(--bg); color: var(--fg); font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; line-height: 1.8; }

<body>
<main>
  <h1>菅平キャンプ 事務システム</h1>
  <p>
    菅平で行うキャンプの事務作業（申込の集計、参加費の計算、当日の受付、領収書のメール送信、名簿・名札の作成）を手伝う、
    運営スタッフ用の小さな仕組みです。Google スプレッドシート・Google フォーム上で動く Google Apps Script でできています。
  </p>
  <p>
    一般の方に公開しているサービスではありません。使うのはキャンプの運営スタッフだけで、
    Google アカウントの承認は運営用のアカウントでのみ行います。
  </p>
  <ul>
    <li><a href="privacy.html">プライバシーポリシー</a></li>
